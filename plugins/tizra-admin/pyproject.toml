[project]
name = "tizra-admin-mcp"
version = "0.4.0"
description = "MCP server giving Claude Code access to the Tizra admin API"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27",
    # Verify TLS against the OS trust store, where the Vagrant CA is installed; certifi lacks it.
    "truststore>=0.10",
]

[project.scripts]
tizra-admin-mcp = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "site_credentials", "tizra_client"]

[dependency-groups]
test = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The working tree, not the copy of the project installed in the environment.
pythonpath = [".", "tests"]
